<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">芽</div><div><div class="brand-name">博士進学マッチ</div><div class="brand-sub">大学・企業コンソーシアム</div></div></div>
    <div class="side-label">WORKSPACE</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom"><div class="help-card"><b>進学相談について</b><p>利用方法や登録内容でお困りですか？</p><button data-action="help">事務局に問い合わせる ↗</button></div><div class="user-mini"><div class="avatar">佐</div><div><strong>佐藤 直子</strong><small id="user-role-label">会員企業研究者</small></div></div></div>
  </aside>
  <section class="workspace">
    <header class="topbar"><div class="crumb" id="crumb">ワークスペース　/　研究室を探す</div><div class="top-actions"><span class="member-chip">✓ コンソーシアム会員</span><button class="role-switch" id="role-switch">研究者ビュー　⌄</button><button class="bell" aria-label="通知">♧</button></div></header>

  </section>
</div>
<div class="modal-backdrop" id="modal-backdrop" role="presentation"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const labs=[
 {id:1,university:'東都工業大学',mark:'東',name:'先端材料循環研究室',prof:'教授　水野 玲子',summary:'電池材料の資源循環と、使用済み蓄電池からの高効率な金属回収プロセスを研究しています。企業との共同研究実績があります。',tags:['材料工学','資源循環','電池リサイクル'],city:'東京都',format:'社会人・長期履修相談可',accept:'相談受付中',color:'#e6efe5',details:'企業での研究経験を活かしたテーマ設定を歓迎しています。平日夜間やオンラインでの研究相談にも対応可能です。研究テーマの適合性や受入れ時期は、相談後に担当教員が確認します。'},
 {id:2,university:'北浜大学',mark:'北',name:'知能ロボティクス研究室',prof:'准教授　高橋 健',summary:'人と協働するロボットの制御、安全な動作計画、製造現場での導入手法を研究。現場課題を起点とした研究テーマを重視しています。',tags:['ロボティクス','制御工学','製造DX'],city:'大阪府',format:'社会人学生の受入れ実績あり',accept:'相談受付中',color:'#e8eafa',details:'製造業での実務課題を研究テーマに発展させる相談を受け付けています。指導方法や研究設備の利用条件は個別に確認します。'},
 {id:3,university:'みらい科学大学',mark:'み',name:'データ駆動型創薬研究室',prof:'教授　井上 美咲',summary:'機械学習を用いた候補化合物探索や、実験データ解析の方法論を研究しています。情報系・生命科学系の連携テーマを募集しています。',tags:['データサイエンス','創薬','機械学習'],city:'神奈川県',format:'オンライン併用・要相談',accept:'相談受付中',color:'#f6e9dc',details:'データ分析や計算科学を活用した研究テーマについて、企業研究者との意見交換を歓迎します。共同研究の可否は大学の規程に基づき別途確認します。'},
 {id:4,university:'西都大学',mark:'西',name:'地域エネルギーシステム研究室',prof:'教授　小林 大介',summary:'再生可能エネルギーの需給予測、地域マイクログリッド、蓄電システムの運用最適化を研究しています。',tags:['エネルギー','最適化','地域連携'],city:'福岡県',format:'社会人・長期履修相談可',accept:'相談受付中',color:'#e9eee3',details:'企業での実証フィールドや運用データを活用した研究テーマについて相談できます。研究データの取り扱い条件は事前に協議します。'},
 {id:5,university:'東都工業大学',mark:'東',name:'人間中心AI研究室',prof:'准教授　森 由香',summary:'説明可能なAI、現場で信頼される意思決定支援、ヒューマンAI協働の設計を研究しています。',tags:['人工知能','説明可能性','HCI'],city:'東京都',format:'社会人学生の受入れ実績あり',accept:'相談受付中',color:'#e6efe5',details:'実際の業務現場で生じる課題や意思決定を題材に、研究課題の整理から相談できます。'},
 {id:6,university:'北浜大学',mark:'北',name:'高分子プロセス設計研究室',prof:'教授　山本 修',summary:'高機能樹脂の成形プロセス、再生材料の品質評価、製造条件のデータ活用に取り組んでいます。',tags:['高分子','製造プロセス','品質評価'],city:'大阪府',format:'要相談',accept:'相談受付中',color:'#e8eafa',details:'材料メーカーや加工企業の研究者からの相談を受け付けています。'}
];
let activePage='search', role='researcher', selectedLab=null, favorites=new Set([2]), requests=[{id:1001,lab:2,title:'製造ラインにおける協働ロボットの安全制御',date:'2026年10月18日',status:'大学確認中',kind:'wait',text:'製造現場でのロボット導入経験を活かし、安全な動作計画について研究相談を希望しています。'}];
const $=s=>document.querySelector(s), content=$('#content'), nav=$('#nav');
const pages={researcher:[['search','⌕','研究室を探す'],['favorites','♡','お気に入り'],['requests','▤','相談管理'],['profile','◉','プロフィール']],university:[['inbox','▤','相談を受ける'],['my-labs','⌂','研究室情報'],['profile','◉','担当者情報']],admin:[['members','♧','会員管理'],['catalog','⌂','掲載情報'],['inbox','▤','相談状況']]};
function labelPage(id){const item=pages[role].find(x=>x[0]===id);return item?item[2]:'ワークスペース'}
function renderNav(){nav.innerHTML=pages[role].map(([id,icon,label])=>`<button class="${activePage===id?'active':''}" data-page="${id}"><span class="nav-icon">${icon}</span>${label}${id==='requests'||id==='inbox'?`<span class="nav-count">${requests.length}</span>`:''}</button>`).join('');$('#user-role-label').textContent=role==='researcher'?'会員企業研究者':role==='university'?'会員大学担当者':'コンソーシアム事務局';$('#role-switch').textContent=(role==='researcher'?'研究者':role==='university'?'大学担当者':'事務局')+'ビュー　⌄';}
function pageTitle(text){$('#crumb').textContent='ワークスペース　/　'+text}
function card(lab){return `<article class="lab-card"><div class="card-top"><div class="university"><span class="uni-mark" style="background:${lab.color}">${lab.mark}</span>${lab.university}</div><button class="save-btn ${favorites.has(lab.id)?'saved':''}" data-fav="${lab.id}" aria-label="お気に入り">${favorites.has(lab.id)?'♥':'♡'}</button></div><h3>${lab.name}</h3><div class="professor">${lab.prof}</div><p class="lab-summary">${lab.summary}</p><div class="tags">${lab.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag warm">${lab.format}</span></div><div class="card-meta"><span>⌖ ${lab.city}</span><span>◷ 社会人進学相談</span></div><div class="card-footer"><span class="accepting">${lab.accept}</span><button class="detail-btn" data-detail="${lab.id}">研究室の詳細を見る　→</button></div></article>`}
function searchPage(){pageTitle('研究室を探す');content.innerHTML=`<div class="sample-note"><span></span>画面確認用のサンプルデータです</div><section class="hero"><div><div class="eyebrow">FIND YOUR NEXT CHAPTER</div><h1>研究テーマから、<br>次の一歩を。</h1><p>あなたの経験を活かせる大学院研究室を探してみましょう。</p></div><div class="hero-aside"><i class="online-dot"></i>現在 <b>${labs.length}</b> 件の研究室が相談を受付中</div></section><section class="search-panel"><div class="search-title"><strong>研究室を検索</strong><span>条件を組み合わせて探せます</span></div><div class="search-fields"><input id="query" type="search" placeholder="研究テーマ、キーワード、大学名" aria-label="キーワード"><select id="field-filter"><option value="">すべての研究分野</option>${['材料工学','ロボティクス','データサイエンス','エネルギー','人工知能','高分子'].map(x=>`<option>${x}</option>`).join('')}</select><select id="format-filter"><option value="">受入れ条件を指定しない</option><option>社会人・長期履修相談可</option><option>社会人学生の受入れ実績あり</option><option>オンライン併用・要相談</option></select><button class="search-submit" id="search-submit">研究室を探す　⌕</button></div><div class="search-foot"><span>まずは気になる研究室をお気に入りに保存できます</span><button class="reset-btn" id="reset-search">条件をリセット</button></div></section><div class="summary-row"><h2>相談を受付中の研究室 <span id="result-count">${labs.length} 件</span></h2><select class="sort" id="sort"><option>おすすめ順</option><option>大学名順</option></select></div><div class="results" id="results">${labs.map(card).join('')}</div>`;$('#search-submit').onclick=filterLabs;$('#query').onkeydown=e=>{if(e.key==='Enter')filterLabs()};$('#field-filter').onchange=filterLabs;$('#format-filter').onchange=filterLabs;$('#reset-search').onclick=()=>{$('#query').value='';$('#field-filter').value='';$('#format-filter').value='';filterLabs()};$('#sort').onchange=filterLabs;}
function filterLabs(){const q=$('#query').value.trim().toLowerCase(),f=$('#field-filter').value,fmt=$('#format-filter').value;let list=labs.filter(l=>(!q||[l.university,l.name,l.prof,l.summary,...l.tags].join(' ').toLowerCase().includes(q))&&(!f||l.tags.includes(f))&&(!fmt||l.format===fmt));if($('#sort').value==='大学名順')list.sort((a,b)=>a.university.localeCompare(b.university,'ja'));$('#result-count').textContent=`${list.length} 件`;$('#results').innerHTML=list.length?list.map(card).join(''):`<div class="empty"><b>条件に合う研究室が見つかりませんでした</b>検索キーワードや絞り込み条件を変更してお試しください。</div>`;}
function favoritesPage(){pageTitle('お気に入り');const list=labs.filter(l=>favorites.has(l.id));content.innerHTML=`<div class="page-head"><div><div class="eyebrow">SAVED LABORATORIES</div><h1>お気に入り</h1><p>気になる研究室をまとめて比較できます。</p></div><button class="secondary" data-page="search">＋ 研究室を探す</button></div><div class="summary-row"><h2>保存した研究室 <span>${list.length} 件</span></h2></div><div class="results">${list.length?list.map(card).join(''):'<div class="empty"><b>まだお気に入りはありません</b>研究室カードの♡を押すと、ここに保存されます。</div>'}</div>`}
function requestsPage(forUniversity=false){pageTitle(forUniversity?'相談を受ける':'相談管理');const title=forUniversity?'届いた相談':'相談管理';content.innerHTML=`<div class="page-head"><div><div class="eyebrow">${forUniversity?'INCOMING CONSULTATIONS':'YOUR CONSULTATIONS'}</div><h1>${title}</h1><p>${forUniversity?'研究者から届いた相談を確認し、回答や面談調整を行います。':'申込みの状況と、大学からの回答を確認できます。'}</p></div>${!forUniversity?'<button class="secondary" data-page="search">研究室を探す</button>':''}</div><div class="panel"><div class="summary-row"><h2>${forUniversity?'新着・対応中':'送信した相談'} <span>${requests.length} 件</span></h2><select class="sort"><option>すべての状態</option><option>確認中</option><option>完了</option></select></div><div class="request-list">${requests.length?requests.map(r=>`<article class="request-card"><div><span class="status ${r.kind}">${r.status}</span><h3>${r.title}</h3><p>${forUniversity?'申込者：佐藤 直子（東亜技研株式会社）':'相談先：'+(labs.find(l=>l.id===r.lab)?.university||'大学')+' ／ '+(labs.find(l=>l.id===r.lab)?.name||'研究室')}</p><p>${r.text}</p><span class="request-date">申込日 ${r.date}　·　受付番号 #${r.id}</span></div>${forUniversity?`<button class="secondary" data-reply="${r.id}">相談を確認</button>`:'<button class="detail-btn" data-reply="'+r.id+'">詳細　→</button>'}</article>`).join(''):'<div class="empty"><b>相談はまだありません</b>研究室に相談を申し込むと、ここに表示されます。</div>'}</div></div>`}
function profilePage(){pageTitle('プロフィール');content.innerHTML=`<div class="page-head"><div><div class="eyebrow">YOUR PROFILE</div><h1>研究者プロフィール</h1><p>研究室への相談時に共有する情報を登録します。</p></div></div><div class="profile-grid"><aside class="profile-side"><div class="avatar">佐</div><div><h3>佐藤 直子</h3><p>東亜技研株式会社 · 研究開発部</p><div class="progress"><i></i></div><small>プロフィール充実度　72%</small></div></aside><form class="panel profile-form" id="profile-form"><div class="form-item"><label>氏名</label><input value="佐藤 直子"></div><div class="form-item"><label>所属企業</label><input value="東亜技研株式会社"></div><div class="form-item"><label>職種・役職</label><input value="研究開発部・主任研究員"></div><div class="form-item"><label>希望する通学形態</label><select><option>社会人・長期履修を希望</option><option>通学中心</option><option>オンライン併用</option></select></div><div class="form-item full"><label>研究テーマ・関心分野</label><textarea>製造現場における協働ロボットの安全制御と、人とロボットが共に働く環境の設計に関心があります。</textarea><span class="form-hint">相談先の大学担当者に共有されます。</span></div><div class="form-item full"><label>これまでの研究・業務経験</label><textarea>生産技術および自動化設備の開発に約8年間従事。現在は協働ロボットの導入プロジェクトを担当しています。</textarea></div><div class="form-item full"><label class="checkline"><input type="checkbox" checked> 相談を申し込んだ研究室の担当者に、上記プロフィールを共有することに同意します。</label></div><div class="form-actions"><button type="button" class="secondary" data-action="toast" data-message="変更を取り消しました">キャンセル</button><button class="primary" type="submit">プロフィールを保存</button></div></form></div>`;$('#profile-form').onsubmit=e=>{e.preventDefault();toast('プロフィールを保存しました')};}
function universityLabs(){pageTitle('研究室情報');content.innerHTML=`<div class="page-head"><div><div class="eyebrow">LABORATORY PROFILE</div><h1>研究室情報</h1><p>研究者に公開する研究内容と受入れ条件を管理します。</p></div><button class="primary" data-action="toast" data-message="新しい研究室の登録フォームを開きます">＋ 研究室を追加</button></div><div class="results">${labs.slice(0,2).map(l=>`<article class="lab-card"><div class="card-top"><div class="university"><span class="uni-mark">${l.mark}</span>${l.university}</div><span class="status">公開中</span></div><h3>${l.name}</h3><p class="lab-summary">${l.summary}</p><div class="tags">${l.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="card-footer"><span class="accepting">${l.accept}</span><button class="detail-btn" data-action="toast" data-message="研究室情報の編集フォームを開きます">情報を編集　→</button></div></article>`).join('')}</div>`}
function adminPage(){pageTitle(activePage==='members'?'会員管理':'掲載情報');content.innerHTML=`<div class="page-head"><div><div class="eyebrow">CONSORTIUM OFFICE</div><h1>${activePage==='members'?'会員・利用者管理':'掲載情報の確認'}</h1><p>会員確認と、コンソーシアム内の情報を管理します。</p></div></div><div class="admin-kpis"><div class="kpi"><small>承認済み会員組織</small><strong>24<em>組織</em></strong></div><div class="kpi"><small>掲載中の研究室</small><strong>${labs.length}<em>件</em></strong></div><div class="kpi"><small>確認が必要な相談</small><strong>${requests.length}<em>件</em></strong></div></div><div class="table-wrap"><table class="table"><thead><tr><th>組織・研究室</th><th>区分</th><th>状態</th><th>最終更新</th><th>操作</th></tr></thead><tbody>${[['東都工業大学','会員大学','承認済み','2026/10/19'],['北浜大学','会員大学','承認済み','2026/10/18'],['東亜技研株式会社','会員企業','承認済み','2026/10/12'],['みらい科学大学','会員大学','確認待ち','2026/10/20']].map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}<td><div class="table-actions"><button data-action="toast" data-message="詳細を表示します">詳細</button><button data-action="toast" data-message="状態を更新しました">状態変更</button></div></td></tr>`).join('')}</tbody></table></div>`}
function render(){renderNav();if(role==='researcher'){if(activePage==='search')searchPage();else if(activePage==='favorites')favoritesPage();else if(activePage==='requests')requestsPage();else profilePage()}else if(role==='university'){if(activePage==='inbox')requestsPage(true);else if(activePage==='my-labs')universityLabs();else profilePage()}else{if(activePage==='inbox')requestsPage(true);else adminPage()}}
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openDetail(id){selectedLab=labs.find(x=>x.id===id);$('#modal').innerHTML=`<div class="modal-head"><div><div class="university"><span class="uni-mark" style="background:${selectedLab.color}">${selectedLab.mark}</span>${selectedLab.university}</div><h2 id="modal-title">${selectedLab.name}</h2><div class="professor">${selectedLab.prof}</div></div><button class="modal-close" data-action="close" aria-label="閉じる">×</button></div><p>${selectedLab.summary}</p><div class="tags">${selectedLab.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag warm">${selectedLab.format}</span></div><div class="modal-section"><h4>研究室について</h4><p>${selectedLab.details}</p></div><div class="modal-section"><h4>相談前にご確認ください</h4><p>この画面は研究テーマや受入れ条件について相談するためのものです。相談の受付は、入学や受入れを保証するものではありません。出願資格・入試・在学方法は大学の正式な案内をご確認ください。</p></div><div class="modal-actions"><button class="secondary" data-fav="${id}">${favorites.has(id)?'♥ 保存済み':'♡ お気に入り'}</button><button class="primary" data-apply="${id}">この研究室に相談する　→</button></div>`;$('#modal-backdrop').classList.add('open')}
function openApply(id){selectedLab=labs.find(x=>x.id===id);$('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">CONSULTATION REQUEST</div><h2 id="modal-title">研究室に相談する</h2><div class="professor">${selectedLab.university} · ${selectedLab.name}</div></div><button class="modal-close" data-action="close" aria-label="閉じる">×</button></div><p>プロフィールの公開項目と相談内容が、選択した研究室の担当者に共有されます。</p><form class="modal-form" id="apply-form"><div class="form-item"><label>相談したい内容 <span style="color:#c36d42">必須</span></label><textarea id="apply-text" required minlength="20" maxlength="2000" placeholder="関心のある研究テーマ、これまでの経験、確認したいことなどを入力してください。">${selectedLab.id===2?'製造現場での協働ロボット導入経験を活かし、安全な動作計画について研究相談を希望しています。社会人学生としての指導形態や、研究テーマの進め方についてお伺いしたいです。':''}</textarea><span class="form-hint">20〜2,000文字</span></div><div class="form-item"><label>希望する連絡方法</label><select><option>アプリ上の回答を希望</option><option>メールでの連絡を希望</option></select></div><label class="checkline"><input id="consent" type="checkbox" required checked> 研究室担当者にプロフィールの公開項目を共有することに同意します。</label><div class="modal-actions"><button type="button" class="secondary" data-action="close">戻る</button><button class="primary" type="submit">相談を申し込む</button></div></form>`;$('#apply-form').onsubmit=e=>{e.preventDefault();if(!$('#consent').checked){toast('プロフィール共有への同意が必要です');return}requests.unshift({id:1000+Math.floor(Math.random()*8999),lab:selectedLab.id,title:$('#apply-text').value.slice(0,32)+( $('#apply-text').value.length>32?'…':''),date:new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric'}).format(new Date()),status:'申込済み',kind:'wait',text:$('#apply-text').value});closeModal();toast('相談を申し込みました');activePage='requests';render()}}
function closeModal(){$('#modal-backdrop').classList.remove('open')}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){activePage=p.dataset.page;render();return}const f=e.target.closest('[data-fav]');if(f){const id=Number(f.dataset.fav);favorites.has(id)?favorites.delete(id):favorites.add(id);toast(favorites.has(id)?'お気に入りに保存しました':'お気に入りを解除しました');if($('#modal-backdrop').classList.contains('open'))openDetail(id);else render();return}const d=e.target.closest('[data-detail]');if(d){openDetail(Number(d.dataset.detail));return}const a=e.target.closest('[data-apply]');if(a){openApply(Number(a.dataset.apply));return}const act=e.target.closest('[data-action]');if(act){if(act.dataset.action==='close')closeModal();else if(act.dataset.action==='help')toast('事務局への問い合わせフォームを準備しています');else toast(act.dataset.message||'更新しました');return}const r=e.target.closest('[data-reply]');if(r){const req=requests.find(x=>x.id===Number(r.dataset.reply));$('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">CONSULTATION</div><h2 id="modal-title">相談内容の確認</h2></div><button class="modal-close" data-action="close">×</button></div><p><b>${req.title}</b></p><p>${req.text}</p><div class="modal-section"><h4>大学からの回答</h4><p>このモックアップでは、回答や面談調整の操作イメージを確認できます。</p></div><div class="modal-actions"><button class="secondary" data-action="close">閉じる</button><button class="primary" data-action="toast" data-message="面談候補日を入力する画面を開きます">面談候補を提示</button></div>`;$('#modal-backdrop').classList.add('open')}});
$('#role-switch').onclick=()=>{const roles=['researcher','university','admin'];role=roles[(roles.indexOf(role)+1)%roles.length];activePage=role==='researcher'?'search':role==='university'?'inbox':'members';render();toast('表示を切り替えました')};$('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
